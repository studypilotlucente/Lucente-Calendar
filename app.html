<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dashboard | Lucente Calendar</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;900&family=Poppins:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-layout fade-in">
    <aside class="sidebar">
      <div class="brand">
        <img src="logo.svg" alt="Lucente logo" />
        <h1>Lucente</h1>
      </div>

      <nav>
        <button class="side-link active" onclick="showView('dashboard', this)">Dashboard</button>
        <button class="side-link" onclick="showView('calendar', this)">Calendar</button>
        <button class="side-link" onclick="showView('week', this)">Week</button>
        <button class="side-link" onclick="showView('friends', this)">Friends</button>
      </nav>

      <button onclick="logout()" class="logout-btn">Log out</button>
    </aside>

    <main class="dashboard">
      <section class="profile-card glass">
        <div>
          <h2 id="userName">Loading...</h2>
          <p id="userEmail"></p>
        </div>
        <img id="userPhoto" src="logo.svg" alt="User profile" />
      </section>

      <section id="dashboardView" class="view active-view">
        <div class="stats-grid">
          <div class="stat-card glass">
            <h3 id="totalEvents">0</h3>
            <p>Total events</p>
          </div>
          <div class="stat-card glass">
            <h3 id="todayEvents">0</h3>
            <p>Today</p>
          </div>
          <div class="stat-card glass">
            <h3 id="friendCount">0</h3>
            <p>Friends</p>
          </div>
        </div>

        <section class="dash-grid">
          <div class="panel glass">
            <h2>Add Event</h2>
            <input id="eventTitle" placeholder="Event title" />
            <input id="eventDate" type="date" />
            <input id="eventTime" type="time" />

            <select id="eventCategory">
              <option value="Personal">Personal</option>
              <option value="School">School</option>
              <option value="Family">Family</option>
              <option value="Friends">Friends</option>
              <option value="Work">Work</option>
            </select>

            <select id="eventPriority">
              <option value="Normal">Normal priority</option>
              <option value="Important">Important</option>
              <option value="Urgent">Urgent</option>
            </select>

            <textarea id="eventNotes" placeholder="Notes / details"></textarea>

            <button onclick="addEvent()" class="primary-btn full-btn">Add Event</button>
          </div>

          <div class="panel glass">
            <h2>Today</h2>
            <div id="todayList"></div>
          </div>

          <div class="panel glass wide">
            <h2>Upcoming Events</h2>
            <div id="eventList"></div>
          </div>
        </section>
      </section>

      <section id="calendarView" class="view">
        <div class="panel glass wide">
          <div class="calendar-header">
            <button onclick="changeMonth(-1)" class="small-btn">←</button>
            <h2 id="monthTitle">Month</h2>
            <button onclick="changeMonth(1)" class="small-btn">→</button>
          </div>

          <div class="calendar-days">
            <strong>Sun</strong>
            <strong>Mon</strong>
            <strong>Tue</strong>
            <strong>Wed</strong>
            <strong>Thu</strong>
            <strong>Fri</strong>
            <strong>Sat</strong>
          </div>

          <div id="calendarGrid" class="calendar-grid"></div>
        </div>

        <div class="panel glass wide">
          <h2 id="selectedDateTitle">Selected Date</h2>
          <div id="selectedDateEvents"></div>
        </div>
      </section>

      <section id="weekView" class="view">
        <div class="panel glass wide">
          <h2>This Week</h2>
          <div id="weekSchedule" class="week-schedule"></div>
        </div>
      </section>

      <section id="friendsView" class="view">
        <section class="dash-grid">
          <div class="panel glass">
            <h2>Find Friends</h2>
            <input id="friendSearch" placeholder="Search by email, name or username" />
            <button onclick="searchFriend()" class="primary-btn full-btn">Search</button>
            <div id="searchResult"></div>
          </div>

          <div class="panel glass">
            <h2>My Friends</h2>
            <div id="friendsList"></div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
