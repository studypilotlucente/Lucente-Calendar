<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Fonts (THIS is what we added) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700&family=Poppins:wght@700&display=swap" rel="stylesheet">

  <title>Lucente Calendar | Shared Social Calendar</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="landing">
    <nav class="top-nav">
      <h1>Lucente Calendar</h1>
      <div>
        <button onclick="showAuth('signin')" class="nav-link">Sign In</button>
        <button onclick="showAuth('signup')" class="nav-cta">Get Started</button>
      </div>
    </nav>

    <section class="hero">
      <div class="hero-text">
        <h2>Your calendar, friends and plans in one place.</h2>
        <p>
          Lucente Calendar helps you organise events, add friends,
          and plan together in a modern way.
        </p>

        <button onclick="showAuth('signup')" class="primary-btn">Get Started</button>
        <button onclick="showAuth('signin')" class="secondary-btn">Sign In</button>
      </div>

      <div class="hero-image"></div>
    </section>

    <section id="authBox" class="auth-box hidden">
      <h2 id="authTitle">Sign In</h2>

      <input id="nameInput" type="text" placeholder="Name" class="signup-only" />
      <input id="emailInput" type="email" placeholder="Email" />
      <input id="passwordInput" type="password" placeholder="Password" />

      <button id="emailAuthBtn" class="primary-btn">Continue</button>
      <button onclick="googleLogin()" class="google-btn">Continue with Google</button>
    </section>
  </main>

  <script type="module" src="auth.js"></script>
</body>
</html>
